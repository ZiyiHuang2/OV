name: CPU module and data tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/test.txt
      - run: python -m pip install 'setuptools<81' wheel
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/test.txt
      - run: MAX_JOBS=2 python -m pip install --no-build-isolation 'git+https://github.com/facebookresearch/detectron2.git@1e3e13bbf607b54f62205c4c33922521822fb298'
      - run: python -m pytest -q
      - run: python tools/check_baseline_equivalence.py
      - run: python tools/check_prototype_compatibility.py
      - run: python tools/smoke_aggregator.py --classes 17 --full
      - run: python tools/smoke_aggregator.py --classes 17 --selective
      - run: python tools/smoke_aggregator.py --classes 17 --full --epl-routing uniform
      - run: python tools/smoke_aggregator.py --classes 17 --full --cad-scope per_class
      - run: python tools/smoke_aggregator.py --classes 17 --full --epl-routing uniform --cad-scope per_class
      - run: python tools/probe_module_cost.py
      - run: python tools/smoke_aggregator.py --classes 17 --interaction
